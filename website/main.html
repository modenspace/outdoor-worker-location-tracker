
<!DOCTYPE html>
<html>
    <style>
        body {
            display: flex;
            flex-direction: column; 
            align-items: flex-start;
            height: 100vh;
            background-color: #000000; 
            font-family: 'Arial', sans-serif;
            color: rgb(255, 255, 255);
            margin: 0; 
            padding-left: 20px; 
        }
        .selected {
            color:#da0000; /* colour to outline selected user */
        }

        @media screen and (max-width: 600px){
            #map {
                height: 50vh;
                width: 100vw;
            }
            #userList {
                width: 100vw;
            }
        }
        </style>
<head>
    <title>Map</title>
    <!-- Include the Google Maps API and Firebase SDK to  allow us to use their services -->
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-firestore.js"></script>
    <script src="<YOUR_MAP_API_KEY>" async defer></script>
    
    <script>
        var map;
        var markers = []; // Array to hold all markers


        // Initialize Firebase
        function initMap() {
            firebase.initializeApp({
                apiKey: "<YOUR_FIREBASE_API_KEY>",
                authDomain: "<YOUR_FIREBASE_AUTH_DOMAIN>",
                projectId: "<YOUR_FIREBASE_PROJECT_ID>",
                storageBucket: "<YOUR_FIREBASE_STORAGE_BUCKET>",
                messagingSenderId: "<YOUR_FIREBASE_MESSAGING_SENDER_ID>",
                appId: "<YOUR_FIREBASE_APP_ID>"
            });
            var db = firebase.firestore();


            map = new google.maps.Map(document.getElementById('map'), {
                center: {lat: 55.3781, lng: -3.4360}, // Center the map to the UK
                zoom: 5 // Adjust the zoom level to show only the UK
            });

            // create a directionrenderer object 
            var directionsRenderer = new google.maps.DirectionsRenderer();


            // Fetch all users from the database and
            var userList = document.getElementById('userList');
            db.collection("users").get().then((querySnapshot) => {
                querySnapshot.forEach((doc) => {
                    var data = doc.data();

                    // Create a list item for each user
                    var li = document.createElement('li');
                    li.textContent = data.name + " - Clock In: " + data.clockIn + ", Clock Out: " + data.clockOut;
                    userList.appendChild(li);

                    // Add a click event listener to the list of users
                    li.addEventListener('click', function() {
                        
                        // Remove the 'selected' class from all list items
                        var listItems = document.querySelectorAll('#userList li');
                        listItems.forEach(function(item) {
                            item.classList.remove('selected');
                        });

                        // Add the 'selected' class to the clicked list item
                        this.classList.add('selected');



                        // Clear the map
                        clearMarkers();

                        // remove the previous route off the map
                        if (directionsRenderer.getMap()) {
                            directionsRenderer.setMap(null);
                        }   

                        // Fetch the user's locations and display the route
                        var locations = data.locations;

                        // if theres only one location, just plot the location on the map
                        if (Array.isArray(locations) && locations.length === 1) {
                            var [lat, lng] = locations[0].split(',').map(Number);
                            var marker = new google.maps.Marker({
                                position: {lat: parseFloat(latLng[0]), lng: parseFloat(latLng[1])},
                                map: map
                            });
                            markers.push(marker);
                        }

                        // if there are more than one location, plot the route on the map
                        else if (Array.isArray(locations) && locations.length > 1) {
                            var start = locations[0].split(",");
                            var end = locations[locations.length - 1].split(",");
                            var waypoints = locations.slice(1, -1).map(location => {
                                var [lat, lng] = location.split(",");
                                 return {
                                    location: new google.maps.LatLng(parseFloat(lat), parseFloat(lng)),
                                    stopover: true
                                };
                            });
                            // Create a request object to fetch the route which includes the start, end and waypoints, used driving mode assuming the user is covering the distance by car
                            var request = {
                                origin: new google.maps.LatLng(parseFloat(start[0]), parseFloat(start[1])),
                                destination: new google.maps.LatLng(parseFloat(end[0]), parseFloat(end[1])),
                                waypoints: waypoints,
                                optimizeWaypoints: true,
                                travelMode: 'DRIVING'
                            };
                            // Create a DirectionsService object to fetch the route which lays out the route on the map
                            var directionsService = new google.maps.DirectionsService();
                            directionsService.route(request, function(result, status) {
                                if (status == 'OK') {
                                    directionsRenderer.setMap(map);
                                    directionsRenderer.setDirections(result);
                                }
                            });
                        }
                    });

                    // Plot all users locations on the map
                    var firstlocation = data.locations[0];
                    if (firstlocation) {
                        var latLng = firstlocation.split(",");
                        var marker = new google.maps.Marker({
                            position: {lat: parseFloat(latLng[0]), lng: parseFloat(latLng[1])},
                            map: map
                        });
                        markers.push(marker);
                    }
                });
            });
        }

        // Function to clear all markers from the map
        function clearMarkers() {
            for (var i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];
        }
    </script>
</head>
<!-- this is the body of the page which will contain the map and the list of users -->
<body onload="initMap()">
    <div id="map" style="height: 50vh; width: 100vw;"></div>
    <ul id="userList"></ul>
</body>
</html>
